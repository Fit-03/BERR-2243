<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Passenger Analytics Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 text-gray-800">

  <!-- Header -->
  <header class="bg-white shadow-md py-6 px-8">
    <h1 class="text-3xl font-bold">GoRide's Passenger Analytics</h1>
    <p class="text-gray-500 mt-1">Live insights of passenger rides, fare, and distance</p>
  </header>

  <main class="p-8 space-y-8">

    <!-- Summary Cards -->
    <section class="grid grid-cols-1 sm:grid-cols-3 gap-6">
      <div class="bg-white rounded-xl p-6 shadow text-center">
        <h3 class="text-sm text-gray-500">Total Rides</h3>
        <p id="totalRides" class="text-3xl font-bold text-blue-600">0</p>
      </div>
      <div class="bg-white rounded-xl p-6 shadow text-center">
        <h3 class="text-sm text-gray-500">Total Fare</h3>
        <p id="totalFare" class="text-3xl font-bold text-green-600">RM 0.00</p>
      </div>
      <div class="bg-white rounded-xl p-6 shadow text-center">
          <h3 class="text-sm text-gray-500">Average Distance</h3>
          <p id="avgDistance" class="text-3xl font-bold text-purple-600">0.00 km</p>
        </div>
    </section>

    <!-- Table -->
    <section class="bg-white p-6 rounded-xl shadow">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold">Detailed Table</h2>
        <button 
          onclick="loadData()" 
          class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition"
        >
          Refresh
        </button>
      </div>
      <div class="overflow-x-auto">
        <table class="min-w-full text-sm border border-gray-200">
          <thead class="bg-gray-100 text-left">
            <tr>
              <th class="py-3 px-4 font-medium text-gray-600">Name</th>
              <th class="py-3 px-4 font-medium text-gray-600">Total Rides</th>
              <th class="py-3 px-4 font-medium text-gray-600">Total Fare</th>
              <th class="py-3 px-4 font-medium text-gray-600">Avg. Distance (km)</th>
            </tr>
          </thead>
          <tbody id="analytics-table" class="bg-white divide-y divide-gray-100">
            <!-- Dynamic data -->
          </tbody>
        </table>
      </div>
    </section>
    
    <!-- Chart -->
    <section class="bg-white p-6 rounded-xl shadow">
      <h2 class="text-lg font-semibold mb-4">Fare by Passenger</h2>
      <canvas id="fareChart" height="100"></canvas>
    </section>


  </main>

  <!-- JS -->
  <script>
    async function fetchAnalytics() {
      const response = await fetch('http://localhost:3000/analytics/passengers', {
        headers: { 'Content-Type': 'application/json' }
      });
      return response.json();
    }

    function renderSummary(data) {
      const totalRides = data.reduce((sum, r) => sum + r.totalRides, 0);
      const totalFare = data.reduce((sum, r) => sum + r.totalFare, 0);
      const avgDistance = data.length
        ? data.reduce((sum, r) => sum + r.avgDistance, 0) / data.length
        : 0;

      document.getElementById('totalRides').textContent = totalRides;
      document.getElementById('totalFare').textContent = 'RM ' + totalFare.toFixed(2);
      document.getElementById('avgDistance').textContent = avgDistance.toFixed(2) + ' km';
    }

    function renderTable(data) {
      const tbody = document.getElementById('analytics-table');
      tbody.innerHTML = '';
      data.forEach(row => {
        tbody.innerHTML += `
          <tr class="hover:bg-slate-50 transition">
            <td class="py-3 px-4 font-medium">${row.name}</td>
            <td class="py-3 px-4">${row.totalRides}</td>
            <td class="py-3 px-4">RM ${row.totalFare.toFixed(2)}</td>
            <td class="py-3 px-4">${row.avgDistance.toFixed(2)}</td>
          </tr>
        `;
      });
    }

    let fareChart; // Chart instance

    function renderChart(data) {
  const ctx = document.getElementById('fareChart').getContext('2d');

  const labels = data.map(d => d.name);
  const fares = data.map(d => d.totalFare);
  const rides = data.map(d => d.totalRides);

  if (fareChart) fareChart.destroy(); // Reset chart on refresh

  fareChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [
        {
          label: 'Total Fare (RM)',
          data: fares,
          backgroundColor: 'rgba(59, 130, 246, 0.7)', // blue
          borderRadius: 5,
        },
        {
          label: 'Total Rides',
          data: rides,
          backgroundColor: 'rgba(16, 185, 129, 0.7)', // green
          borderRadius: 5,
        }
      ]
    },
    options: {
      responsive: true,
      plugins: {
        tooltip: {
          callbacks: {
            label: function(context) {
              const value = context.raw;
              return context.dataset.label === 'Total Fare (RM)' 
                ? `RM ${value.toFixed(2)}`
                : `${value} rides`;
            }
          }
        },
        legend: {
          position: 'top',
          labels: { font: { size: 14 } }
        },
        title: {
          display: true,
          text: 'Passenger Summary: Fare & Rides',
          font: { size: 16 }
        }
      },
      scales: {
        x: {
          title: {
            display: true,
            text: 'Passengers'
          }
        },
        y: {
          beginAtZero: true,
          title: {
            display: true,
            text: 'Value'
          }
        }
      }
    }
  });
}


    async function loadData() {
      try {
        const data = await fetchAnalytics();
        renderSummary(data);
        renderTable(data);
        renderChart(data);
      } catch (err) {
        console.error('Failed to load analytics:', err);
      }
    }

    window.onload = loadData;
  </script>
</body>
</html>
